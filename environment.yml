# Conda environment for this project -- the ONLY environment (there is no separate .venv).
# Captured from the real working env with:  conda env export -n brepnet --no-builds
# (machine-specific 'prefix:' line removed). Includes the Jupyter/pythreejs packages
# used by notebooks/inspect_predictions.ipynb, and streamlit/plotly/networkx used by
# app.py and src/inference, src/screening, src/ui (the screening app).
#
# Recreate:  conda env create -f environment.yml    (then the two extra steps in README.md)
#
# NOT listed here on purpose: occwl. It was installed from source
# (github.com/AutodeskAILab/occwl), is not published on PyPI, so a plain
# 'occwl==3.0.0' pip pin would make 'conda env create' fail. See README.md.
#
# torch is a CPU-only '+cpu' wheel; the extra index below is where those are published
# (inferred from the +cpu version tag -- not verified by a from-scratch rebuild).
